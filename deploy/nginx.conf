# lottery.nzai.me 反代配置
# 放入 /etc/nginx/sites-available/lottery.conf 并软链到 sites-enabled
# 证书由 certbot 申请：sudo certbot --nginx -d lottery.nzai.me

server {
    listen 80;
    server_name lottery.nzai.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lottery.nzai.me;

    ssl_certificate     /etc/letsencrypt/live/lottery.nzai.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lottery.nzai.me/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:23817;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
